<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="description" content="Manage your favourite properties, side-by-side property comparisons, recently viewed residences, saved searches, search history, enquiry history, and demonstration account.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body data-page="account">
  <div id="site-header-mount"></div>

  <main>
    <section class="page-hero">
      <div class="page-hero-bg">
        <img src="https://images.unsplash.com/photo-1600566753190-17f0baa2a6c3?auto=format&fit=crop&w=1600&q=80" alt="Luxury residence panoramic terrace">
      </div>
      <div class="page-hero-scrim"></div>
      <div class="container page-hero-content">
        <nav class="breadcrumb"><a href="index.html">Home</a><span>/</span><span>Client Portal</span></nav>
        <span class="eyebrow eyebrow--light">Personal Portfolio Hub</span>

        <p class="page-hero-desc">Review your shortlisted favourites, side-by-side property comparisons, recently viewed homes, saved searches, enquiry history, and local demonstration profile.</p>

    <section class="section">

        <div class="dashboard-tabs" role="tablist" aria-label="Client Portal Sections">
          <button type="button" class="dash-tab is-active" data-dash-tab="favourites">Favourites</button>

          <button type="button" class="dash-tab" data-dash-tab="enquiries">Enquiry History</button>
          <button type="button" class="dash-tab" data-dash-tab="profile">Demo Account</button>

      </div>

  <div id="site-footer-mount"></div>

  <script src="data.js"></script>
  <script src="state.js"></script>
  <script src="components.js"></script>
